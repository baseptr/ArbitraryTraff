[app]
address = "0.0.0.0:9000"
# root_url переопределяется через env LISTMONK_app__root_url (задаётся в Railway Variables)
root_url = "https://YOUR_DOMAIN"

[db]
# Все значения переопределяются в entrypoint.sh через Railway PostgreSQL vars
host = "localhost"
port = 5432
user = "listmonk"
password = ""
database = "listmonk"
# disable — для внутренней Railway сети (сервис ↔ postgres в одном проекте)
ssl_mode = "disable"
max_open = 25
max_idle = 25
max_lifetime = "300s"
