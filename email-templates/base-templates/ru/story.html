<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Master</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f0;font-family:Georgia,'Times New Roman',serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f0;padding:40px 0;">
  <tr><td align="center">
    <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:4px;overflow:hidden;">

      <!-- Top accent -->
      <tr><td style="background:#1a1a2e;height:3px;font-size:0;">&nbsp;</td></tr>

      <!-- Minimal header -->
      <tr><td style="padding:24px 48px 20px;border-bottom:1px solid #ebebeb;">
        <span style="font-size:11px;color:#bbb;letter-spacing:0.15em;text-transform:uppercase;font-family:-apple-system,sans-serif;">
          CS MASTER · Советы и находки
        </span>
      </td></tr>

      <!-- Campaign content injected here -->
      <tr><td style="padding:36px 48px 24px;font-size:16px;color:#222;line-height:1.8;">
        {{ template "content" . }}
      </td></tr>

      <!-- Disclaimer -->
      <tr><td style="padding:0 48px 16px;">
        <p style="margin:0;font-size:11px;color:#bbb;line-height:1.6;font-family:-apple-system,sans-serif;">
          * Содержит партнёрскую ссылку. Азартные игры могут вызывать зависимость. Играйте ответственно.
        </p>
      </td></tr>

      <!-- Footer -->
      <tr><td style="border-top:1px solid #ebebeb;padding:20px 48px 28px;">
        <p style="margin:0;font-size:11px;color:#bbb;line-height:1.7;font-family:-apple-system,sans-serif;text-align:center;">
          Вы получили это письмо как подписчик CS Master.<br>
          <a href="{{ UnsubscribeURL . }}" style="color:#bbb;text-decoration:underline;">Отписаться от рассылки</a>
          &nbsp;·&nbsp;
          <a href="https://csmaster.cc" style="color:#bbb;text-decoration:none;">csmaster.cc</a>
        </p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
